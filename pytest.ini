[pytest]
# Collection is limited to `tests/` on purpose.
#
# `service/` is a separate deployable with its own `pytest.ini`, its own dependencies and its own
# package called `app` -- which would collide head-on with this repo's `app.py` if both were on the
# same import path. Running the service suite from its own directory keeps the two apart:
#
#     .\.venv\Scripts\python.exe -m pytest            the desktop app
#     cd service; ..\.venv\Scripts\python.exe -m pytest   the licence service
testpaths = tests
norecursedirs = .venv build dist service installer assets .git .pytest_cache __pycache__
